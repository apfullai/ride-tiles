name: Inspect exact public archive response once
on:
  push:
    branches: [feat/mellow-z17-mirror]
    paths: ['.github/workflows/mellow-archive-diagnostic.yml']
permissions: {}
concurrency:
  group: ride-tiles-pages
  cancel-in-progress: false
jobs:
  inspect:
    if: github.ref == 'refs/heads/feat/mellow-z17-mirror' && contains(github.event.head_commit.message, '[inspect-mellow-archive]') && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: One unchanged Python request with bounded response evidence
        run: |
          timeout --signal=TERM --kill-after=3s 40s python3 -u - <<'PY'
          import datetime,hashlib,json,urllib.request,urllib.error
          url='https://test.ride.ap0z.com/mellow/xyz/2bafe73bf6586407/source.zip'
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*args,**kwargs):return None
          opener=urllib.request.build_opener(NoRedirect())
          started=datetime.datetime.now(datetime.timezone.utc).isoformat()
          try:
              response=opener.open(url,timeout=30)
          except urllib.error.HTTPError as error:
              response=error
          with response:
              status=response.status
              limit=4096
              data=response.read(limit)
              headers={k.lower():v for k,v in response.headers.items() if k.lower() in {'content-type','content-length','server','cf-ray','cf-mitigated','cache-control','content-security-policy','x-content-type-options'}}
              result={'started':started,'finished':datetime.datetime.now(datetime.timezone.utc).isoformat(),'status':status,'url':response.geturl(),'headers':headers,'capturedBytes':len(data),'capturedPrefixSHA256':hashlib.sha256(data).hexdigest(),'bodyPreview':data[:2048].decode('utf-8','replace') if status!=200 else None,'requestCount':1,'redirectsFollowed':0}
              print(json.dumps(result,sort_keys=True,indent=2))
          PY
