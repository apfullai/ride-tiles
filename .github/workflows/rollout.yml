name: Continue exact verified mirror artifact deployment
on:
  push:
    branches: [feat/mellow-z17-mirror]
    paths: ['continuation/request.json']
permissions:
  contents: read
concurrency:
  group: ride-tiles-pages
  cancel-in-progress: false
jobs:
  budget:
    if: github.ref == 'refs/heads/feat/mellow-z17-mirror' && contains(github.event.head_commit.message, '[continue-mirror-artifact-12096579037]') && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      allowed: ${{ steps.budget.outputs.allowed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ae037d0d4e37e82314a679006ebe4d86bc0497f5
          persist-credentials: false
      - name: Reserve unchanged monthly publisher budget
        id: budget
        env:
          TILE_GITHUB_READ_TOKEN: ${{ github.token }}
        run: timeout --signal=TERM --kill-after=5s 65s python publishing/actions_budget.py --repository "$GITHUB_REPOSITORY" --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT"
  deploy:
    needs: budget
    if: needs.budget.outputs.allowed == 'true' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: continuation-source
      - uses: actions/checkout@v4
        with:
          ref: ae037d0d4e37e82314a679006ebe4d86bc0497f5
          persist-credentials: false
          path: publisher
      - name: Verify exact artifact and current publication without downloading it
        env:
          GH_TOKEN: ${{ github.token }}
        run: timeout --signal=TERM --kill-after=3s 60s python continuation-source/continuation/guard.py
      - name: One documented Pages REST deployment
        timeout-minutes: 3
        uses: actions/github-script@v7
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          retries: 0
          script: |
            const {run} = require(process.env.GITHUB_WORKSPACE + '/continuation-source/continuation/deploy.cjs');
            try { await run({core}); }
            catch (e) { core.setFailed(e.message); }
